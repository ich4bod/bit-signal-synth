<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8-bit Signal Synthesizer</title><link rel="stylesheet" href="style.css"></head>
<body><main><p class="eyebrow">OFFLINE INSTRUMENT / 1986</p><h1>8-bit Signal Synthesizer</h1><p class="intro">A tiny signal generator with no account, samples, or network calls. Focus this panel and use <kbd>W</kbd>/<kbd>S</kbd>, arrows, <kbd>[</kbd>/<kbd>]</kbd>, <kbd>Space</kbd>, and <kbd>E</kbd>.</p>
<section aria-label="Synthesizer controls" tabindex="0" id="instrument"><label>Waveform <select id="waveform"><option value="square">Square</option><option value="triangle">Triangle</option><option value="sawtooth">Sawtooth</option><option value="sine">Sine</option></select></label><label>Frequency <output id="frequencyValue">440 Hz</output><input id="frequency" type="range" min="55" max="1760" step="5" value="440"></label><label>Duration <output id="durationValue">0.40 s</output><input id="duration" type="range" min="0.05" max="2" step="0.05" value="0.4"></label><div class="buttons"><button id="play">▶ Play</button><button id="export">⇩ Export WAV</button></div></section><p id="status" aria-live="polite">Ready: square wave at 440 Hz for 0.40 seconds.</p></main><script src="app.js"></script></body></html>
